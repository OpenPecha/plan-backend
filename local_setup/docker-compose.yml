version: '3.8'
services:
  db-local:
    image: postgres:16-alpine
    container_name: plan-database
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=planAdmin
      - POSTGRES_DB=plan
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "5434:5432"
    volumes:
      - ./data/database-local:/var/lib/postgresql/data
    networks:
      - plan-network

  dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    volumes:
      - dragonflydata:/data
    restart: always
    networks:
      - pecha-network

 
volumes:
  dragonflydata:

networks:
  plan-network:
    driver: bridge
